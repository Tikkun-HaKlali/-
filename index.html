<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תיקון הכללי - האש שלי</title>
  <style>
    :root {
      --bg-warm: #FAF6F0;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #231F20;
      --text-muted: #5C5552;
      --accent-red: #D92B2B;
      --accent-orange: #F26419;
      --accent-gold: #F6AE2D;
      --border-soft: rgba(35, 31, 32, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-warm);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .bg-emblem-layer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      padding: 24px;
    }

    .bg-emblem-layer svg {
      width: min(88vw, 520px);
      height: auto;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    header.top-header {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 22px 20px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .badge {
      display: inline-block;
      background: rgba(242, 100, 25, 0.12);
      color: var(--accent-red);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.9rem;
      color: var(--accent-red);
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    .progress-bar-box {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reset-btn {
      background: #FFF3E0;
      color: var(--text-main);
      border: 1px solid rgba(242, 100, 25, 0.35);
      border-radius: 10px;
      padding: 7px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 520px) {
      .chapters-grid {
        grid-template-columns: 1fr;
      }
    }

    .chapter-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      text-align: right;
    }

    .chapter-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-orange);
    }

    .chapter-card.is-read {
      border-color: #2E7D32;
      background: rgba(232, 245, 233, 0.92);
    }

    .chapter-title {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .read-pill {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.06);
      color: var(--text-muted);
    }

    .chapter-card.is-read .read-pill {
      background: #2E7D32;
      color: #FFFFFF;
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .contact-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-call,
    .btn-whatsapp {
      display: block;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
    }

    .btn-call {
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-red));
      color: #FFFFFF;
    }

    .btn-whatsapp {
      background: #E8F5E9;
      color: #1B5E20;
      border: 1px solid #A5D6A7;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 12px 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-warm);
      color: var(--text-main);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chapter-body {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-soft);
    }

    .modal-footer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .action-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn.primary {
      background: var(--accent-red);
      color: #FFFFFF;
      border-color: var(--accent-red);
    }
  </style>
</head>
<body>
  <div class="bg-emblem-layer" aria-hidden="true">
    <svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#F6AE2D" />
          <stop offset="55%" stop-color="#F26419" />
          <stop offset="100%" stop-color="#D92B2B" />
        </linearGradient>
        <path id="bottomArc" d="M 55,345 Q 200,415 345,345" />
      </defs>
      <path
        d="M200 28 C232 85, 305 135, 305 225 C305 292, 258 332, 200 332 C142 332, 95 292, 95 225 C95 162, 138 115, 165 75 C168 112, 186 125, 200 28 Z"
        fill="url(#flameGrad)"
      />
      <text
        x="200"
        y="192"
        text-anchor="middle"
        font-size="46"
        font-weight="900"
        fill="#FFF8E7"
      >האש שלי</text>
      <text font-size="24" font-weight="800" fill="#B71C1C">
        <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
          תוקד עד ביאת המשיח
        </textPath>
      </text>
    </svg>
  </div>

  <div class="app-container">
    <header class="top-header">
      <div class="badge">האש שלי • עשרה פרקי תהילים</div>
      <h1>תיקון הכללי</h1>
      <p class="subtitle">לחץ על פרק לפתיחה פנימית וסימון קריאה</p>
    </header>

    <section class="progress-bar-box" aria-label="מעקב קריאה">
      <div id="readCounter">פרקים שסומנו שנקראו: 0 / 10</div>
      <button type="button" class="reset-btn" id="resetBtn">איפוס סימון</button>
    </section>

    <main class="chapters-grid" id="chaptersGrid"></main>

    <section class="contact-card" aria-label="יצירת קשר">
      <h2>יצירת קשר</h2>
      <p style="margin-top: 6px; font-weight: 700;">יעקב שאלתיאל • 0534888995</p>
      <div class="contact-actions">
        <a class="btn-call" href="tel:0534888995">התקשר: 0534888995</a>
        <a
          class="btn-whatsapp"
          href="https://wa.me/972534888995"
          target="_blank"
          rel="noopener noreferrer"
        >שליחת הודעה ב-WhatsApp</a>
      </div>
    </section>

    <footer>כל הזכויות שמורות ליעקב שאלתיאל</footer>
  </div>

  <div class="modal-backdrop" id="chapterModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">פרק</h2>
        <button type="button" class="close-btn" id="closeModalBtn">סגור</button>
      </div>
      <div class="chapter-body" id="modalBody"></div>
      <div class="modal-footer-actions">
        <button type="button" class="action-btn" id="prevChapterBtn">פרק קודם</button>
        <button type="button" class="action-btn primary" id="toggleReadBtn">סומן שנקרא</button>
        <button type="button" class="action-btn" id="nextChapterBtn">פרק הבא</button>
      </div>
    </div>
  </div>

  <script>
    const chapters = [
      { num: 1, title: "פרק ט״ז (א)", psalmRef: "תהילים פרק ט״ז" },
      { num: 2, title: "פרק ל״ב (ב)", psalmRef: "תהילים פרק ל״ב" },
      { num: 3, title: "פרק מ״א (ג)", psalmRef: "תהילים פרק מ״א" },
      { num: 4, title: "פרק מ״ב (ד)", psalmRef: "תהילים פרק מ״ב" },
      { num: 5, title: "פרק נ״ט (ה)", psalmRef: "תהילים פרק נ״ט" },
      { num: 6, title: "פרק ע״ז (ו)", psalmRef: "תהילים פרק ע״ז" },
      { num: 7, title: "פרק צ׳ (ז)", psalmRef: "תהילים פרק צ׳" },
      { num: 8, title: "פרק ק״ה (ח)", psalmRef: "תהילים פרק ק״ה" },
      { num: 9, title: "פרק קל״ז (ט)", psalmRef: "תהילים פרק קל״ז" },
      { num: 10, title: "פרק ק״נ (י)", psalmRef: "תהילים פרק ק״נ" }
    ];

    const STORAGE_KEY = "tikkun_haklali_read_v1";
    let readChapters = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let activeIndex = 0;

    const chaptersGrid = document.getElementById("chaptersGrid");
    const readCounter = document.getElementById("readCounter");
    const resetBtn = document.getElementById("resetBtn");
    const modal = document.getElementById("chapterModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const prevChapterBtn = document.getElementById("prevChapterBtn");
    const nextChapterBtn = document.getElementById("nextChapterBtn");
    const toggleReadBtn = document.getElementById("toggleReadBtn");

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...readChapters]));
    }

    function renderGrid() {
      chaptersGrid.innerHTML = "";
      chapters.forEach((ch, idx) => {
        const isRead = readChapters.has(ch.num);
        const card = document.createElement("button");
        card.type = "button";
        card.className = `chapter-card${isRead ? " is-read" : ""}`;
        card.innerHTML = `
          <span class="chapter-title">${ch.title}</span>
          <span class="read-pill">${isRead ? "נקרא" : "לא נקרא"}</span>
        `;
        card.addEventListener("click", () => openModal(idx));
        chaptersGrid.appendChild(card);
      });
      readCounter.textContent = `פרקים שסומנו שנקראו: ${readChapters.size} / ${chapters.length}`;
    }

    function openModal(idx) {
      activeIndex = idx;
      const ch = chapters[activeIndex];
      const isRead = readChapters.has(ch.num);
      modalTitle.textContent = `${ch.title} — ${ch.psalmRef}`;
      modalBody.innerHTML = `
        <p>מקור הפרק: <strong>${ch.psalmRef}</strong> (פרק ${ch.num} מתוך 10 פרקי תיקון הכללי).</p>
        <p style="margin-top: 10px; color: #5C5552;">ניתן לסמן את הפרק כנקרא בתחתית או לעבור בין הפרקים באמצעות הכפתורים.</p>
      `;
      toggleReadBtn.textContent = isRead ? "בטל סימון קריאה" : "סומן שנקרא";
      prevChapterBtn.disabled = activeIndex === 0;
      nextChapterBtn.disabled = activeIndex === chapters.length - 1;
      modal.classList.add("open");
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    toggleReadBtn.addEventListener("click", () => {
      const chNum = chapters[activeIndex].num;
      if (readChapters.has(chNum)) {
        readChapters.delete(chNum);
      } else {
        readChapters.add(chNum);
      }
      saveProgress();
      renderGrid();
      openModal(activeIndex);
    });

    prevChapterBtn.addEventListener("click", () => {
      if (activeIndex > 0) openModal(activeIndex - 1);
    });

    nextChapterBtn.addEventListener("click", () => {
      if (activeIndex < chapters.length - 1) openModal(activeIndex + 1);
    });

    resetBtn.addEventListener("click", () => {
      readChapters.clear();
      saveProgress();
      renderGrid();
    });

    closeModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    renderGrid();
  </script>
</body>
</html>
